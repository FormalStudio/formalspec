source /boot/grub/config.cfg

menuentry "FormalSpec installer" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ quiet
	initrd @INITRD_LIVE@
}

menuentry "FormalSpec installer (serial console, ttyS0 115200)" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ console=ttyS0,115200 loglevel=3
	initrd @INITRD_LIVE@
}

menuentry "FormalSpec installer (shell only)" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ console=tty0 console=ttyS0,115200 loglevel=3 fspec.session=shell
	initrd @INITRD_LIVE@
}

menuentry "FormalSpec installer (fail-safe)" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ nomodeset noapic noapm nodma nosmp
	initrd @INITRD_LIVE@
}

if [ "${grub_platform}" = "efi" ]; then
	menuentry "UEFI firmware settings" {
		fwsetup
	}
fi
