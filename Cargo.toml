[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/FormalStudio/formalspec"

[workspace.dependencies]
allocative = "0.3.6"
age = { version = "0.12.1", features = ["armor", "ssh"] }
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
diffy = "0.5.2"
brotli-decompressor = "6.1.1"
flate2 = "1.1.10"
glob = "0.3.4"
libc = "0.2.191"
lzma-rs = "0.3.0"
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
notify = "8.2.0"
plist = "1.10.2"
serde_yaml_ng = "0.10.0"
similar = "3.2.0"
serde_yaml = "0.9.34"
shell-words = "1.1.1"
starlark = "0.14.2"
tar = "0.4.46"
tempfile = "3"
toml = "1.1.8"
ureq = "3.4.2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
fspec-build = { path = "crates/fspec-build" }
fspec-core = { path = "crates/fspec-core" }
fspec-dev = { path = "crates/fspec-dev" }
fspec-eval = { path = "crates/fspec-eval" }
fspec-store = { path = "crates/fspec-store" }
fspec-files = { path = "crates/fspec-files" }
fspec-sources = { path = "crates/fspec-sources" }
fspec-pkgmgr = { path = "crates/fspec-pkgmgr" }
fspec-os = { path = "crates/fspec-os" }
fspec-remote = { path = "crates/fspec-remote" }
fspec-image = { path = "crates/fspec-image" }
fspec-switch = { path = "crates/fspec-switch" }
fspec-sync = { path = "crates/fspec-sync" }
